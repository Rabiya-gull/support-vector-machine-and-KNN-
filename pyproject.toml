[project]
name = "support-vector-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rabiya-gull", email = "rabiya.gullkhan000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
        "ipykernel>=7.4.0",
        "matplotlib>=3.11.2",
        "nbformat>=4.2.0",
        "numpy>=2.5.4",
        "pandas>=3.1.0",
        "plotly>=7.1.0",
        "scikit-learn>=1.9.1",
        "seaborn>=0.13.2",
]

[project.scripts]
support-vector-machine = "support_vector_machine:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
